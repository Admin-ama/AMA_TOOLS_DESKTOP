name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate release tag
        run: npm run release:verify
      - name: Types, unit tests and build
        run: npm run check
      - name: Electron integration tests
        run: npx playwright test
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
      # Un solo draft con los tres archivos; electron-builder --publish always
      # creaba drafts duplicados al subir en paralelo.
      - name: Create draft release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "AMATIME Tools $GITHUB_REF_NAME" \
            "release/AMATIME-Tools-Setup-${version}-x64.exe" \
            "release/AMATIME-Tools-Setup-${version}-x64.exe.blockmap" \
            release/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
